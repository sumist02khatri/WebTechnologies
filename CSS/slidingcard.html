<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Cards</title>
    <link rel="stylesheet" href="slidingCard.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="sliding-cards">
        <div class="card">
            <div class="top-part">
                <img src="./pic 1.jpg" alt="Profile photo">
                <div class="social-icons">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-github"></i>
            </div>
            </div>
            
            <h3>Sumist Khatri</h3>
            <p>Software Developer</p>
            <div class="stars">★★★★☆</div>
            <div class="buttons">
                <button>About Me</button>
                <button>Hire Me</button>
            </div>
        </div>
        <div class="card">
            <div class="top-part">
                <img src="./pic2.jpg" alt="Profile photo">
                 <div class="social-icons">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-github"></i>
            </div>
            </div>
           
            <h3>Sumit Gupta</h3>
            <p>Government Employee</p>
            <div class="stars">★★★★☆</div>
            <div class="buttons">
                <button>About Me</button>
                <button>Hire Me</button>
            </div>
        </div>
        <div class="card">
            <div class="top-part">
                <img src="./pic3.jpg" alt="Profile photo">
                 <div class="social-icons">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-github"></i>
            </div>
            </div>
           
            <h3>Kundan Krishna</h3>
            <p>Advocate</p>
            <div class="stars">★★★★☆</div>
            <div class="buttons">
                <button>About Me</button>
                <button>Hire Me</button>
            </div>
        </div>
    </div>

</body>

</html>
