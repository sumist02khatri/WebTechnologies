<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableCreationByusinghtml</title>
</head>
<body>
    <table border cellspacing="20px" cellpadding="10px"  style="border-collapse: collapse;">
        <!-- table row -->
        <tr>
            <!-- table header -->
            <th>SI.NO</th>
            <th>Sname</th>
            <th>Sbranch</th>
            <th>Ssection</th>
            <th>Sgrade</th>
        </tr>
        <tr>
            <!-- table data -->
            <td>1</td>
            <td>Sheela</td>
            <td>ECE</td>
            <td colspan="2">A</td>
            <!-- <td>A</td> -->
        </tr>
        <tr>
            <td>2</td>
            <td>Mala</td>
            <td rowspan="2">EEE</td>
            <td>B</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Dinga</td>
            <!-- <td>EEE</td> -->
            <td>C</td>
            <td>B</td>
        </tr>
    </table>
</body>
</html>
