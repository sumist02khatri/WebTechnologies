<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elements in html</title>
</head>
<body>
    <!-- !element:-start tag some content closed tag (or) Tag along with some content -->
     <!-- !Block-level element:-which element takes entire width of the browser and starts from the new linex -->
     <!-- paragraph tag -->
     <p>iam paragraph</p>
     <p>iam second paragraph</p>
     <p>iam thrid paragraph</p>
     <!-- !inline-element:-which takes only content width and starts from the same line -->
      <span>iam span1</span>
      <span>iam span2</span>
</body>
</html>
