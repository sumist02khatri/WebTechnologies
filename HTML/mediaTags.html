<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media tag in HTML</title>
</head>
<body>
    <audio controls loop>
        <source src="./Tabaahi Toxic 320 Kbps.mp3" type="audio/mpeg">
        Your browser does not support the audio element.    
    </audio>    

    <video controls loop width="400px" height="300px">
        <source src="./God Mode - Video Song _ Suriya's Karuppu .mp4" type="video/mp4">
        <!-- Fallback message shown when the browser cannot play the video element.  -->
        Your browser does not support the video tag.
    </video>

    <h2>Iframe tag</h2>
    <p>
        The <code>&lt;iframe&gt;</code> tag embeds another HTML page or external content
        inside the current page. The <code>src</code> attribute specifies the content to
        display, while <code>width</code> and <code>height</code> set its dimensions.
    </p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d2980.173376491269!2d84.629258074456!3d24.813372977960004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjTCsDQ4JzQ4LjEiTiA4NMKwMzcnNTQuNiJF!5e1!3m2!1sen!2sin!4v1790749727942!5m2!1sen!2sin" 
    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
