<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnchorTag in html</title>
</head>
<body>
    <!-- !anchorTag:-which is used to link from one webpage to another webpage -->
     <!-- hypertext->hyperlink -->
      <!-- hyper text reference -->
     <a href="https://www.amazon.com">amazon</a>
     <a href="https://www.flipkart.com">flipkart</a>
     <a href="https://www.meesho.com">meesho</a>
     <!-- i want to convert normal image as a link -->
      <a href="https://www.pixabay.com">
        <img src="./cp17-bulldog-10137179.jpg" alt="" height="300px" width="200px">
      </a>
      <!-- i want to convert html element as a link -->

      <a href="https://www.myntra.com">
        <button>Click</button>
      </a>

      <a href="https://www.twitter.com" target="_blank">twitter</a>
      <!-- all visited links will be in the color of purple -->
       <!-- all unvisited links will be in the color of blue -->
        <!-- all active links will be in the colornof red -->
