<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List creation by using html </title>
</head>
<body>
    <!-- !Unordered list:-which is used to create the list with bullet points and no sequence of the data -->
     <!-- The ul tag is used to create an unordered list -->
      <!--square, circle, disc {style="list-style-type: square;",type="square"}-->
    <ul style="list-style-type: square;" type="square">
        <!-- The li tag is used to create a list item -->
        <li>Milk</li>
        <li>Suger</li>
        <li>Coffee</li> 
    </ul>
    <!--ordered list:-which is used to create the list with numbers and a sequence of the data -->
    <!-- The ol tag is used to create an ordered list -->
    <ol type="A" start="19" style="list-style-type: upper-roman;">
        <li>Milk</li>
        <li>Suger</li>
        <li>Coffee</li> </ol>
    <!--description list:-which is used to create a list with terms and their descriptions -->
    <!-- The dl tag is used to create a description list -->
     <!-- The dt tag is used to create a term in a description list -->
     <!-- The dd tag is used to create a description for a term in a description list -->
    <dl>
            <dt>Milk</dt>
            <dd>The white liquid produced by cows</dd>
            <dt>Suger</dt>
            <dd>A sweet substance used to sweeten food</dd>
            <dt>Coffee</dt>
            <dd>A dark, bitter drink made from the roasted seeds of the coffee plant</dd>
    </dl>

    <!--nested lists:-which is used to create a list within a list -->
    <!--nested lists are created by placing one list inside another -->
    <!-- It can be Ul or Ol -->
    <ol>
        <li>Student Names: </li>
        <li>Courses:
            <ul>
                <li>java</li>
                <li>html</li>
            </ul>
        </li>
        <li>college: </li>
    </ol>

</body>
</html>
